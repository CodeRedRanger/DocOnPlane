name: Self-Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
      - name: Confirm runner
        shell: powershell
        run: |
          Write-Host "GitHub Actions reached my Windows runner."
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          Get-Location
