name: Unreal Shipping Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.1"
        required: true
        default: "0.1.1"

jobs:
  build:
    runs-on: self-hosted

    steps:
      # ---------------------------------------------------------
      # STEP 1 - CHECK OUT GITHUB REPOSITORY
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # ---------------------------------------------------------
      # STEP 2 - BUILD UNREAL PROJECT
      # ---------------------------------------------------------

      - name: Build Unreal project
        shell: powershell
        run: |
          $RunUAT = "D:\UnrealEngine\UE_5.6\Engine\Build\BatchFiles\RunUAT.bat"

          $Project = Join-Path $env:GITHUB_WORKSPACE "DocOnThePlane.uproject"

          $UnrealEditorCmd = "D:\UnrealEngine\UE_5.6\Engine\Binaries\Win64\UnrealEditor-Cmd.exe"

          $BuildOutput = "D:\Builds\DocOnThePlane_GitHubActions"

          if (Test-Path $BuildOutput) {
              Remove-Item $BuildOutput -Recurse -Force
          }

          & $RunUAT BuildCookRun `
          -project="$Project" `
          -nop4 `
          -utf8output `
          -cook `
          -target=DocOnThePlane `
          -unrealexe="$UnrealEditorCmd" `
          -platform=Win64 `
          -installed `
          -stage `
          -archive `
          -package `
          -build `
          -pak `
          -iostore `
          -compressed `
          -prereqs `
          -archivedirectory="$BuildOutput" `
          -clientconfig=Shipping `
          -nodebuginfo

          if ($LASTEXITCODE -ne 0) {
              throw "Unreal build failed with exit code $LASTEXITCODE"
          }

      # ---------------------------------------------------------
      # STEP 3 - VERIFY UNREAL PACKAGE
      # ---------------------------------------------------------

      - name: Verify packaged build
        shell: powershell
        run: |
          $Exe = "D:\Builds\DocOnThePlane_GitHubActions\Windows\DocOnThePlane.exe"

          if (-not (Test-Path $Exe)) {
              throw "Packaged executable was not found: $Exe"
          }

          Write-Host "Shipping build created successfully:"
          Write-Host $Exe

      # ---------------------------------------------------------
      # STEP 4 - STAGE FILES FOR INNO SETUP
      # ---------------------------------------------------------

      - name: Stage installer files
        shell: powershell
        run: |
          $Source = "D:\Builds\DocOnThePlane_GitHubActions\Windows"
          $Destination = "D:\DocOnPlaneInstaller\FilesForInstall"

          if (-not (Test-Path $Source)) {
              throw "Packaged Windows folder was not found: $Source"
          }

          Write-Host "Clearing old installer staging files..."

          if (Test-Path $Destination) {
              Remove-Item "$Destination\*" -Recurse -Force
          }
          else {
              New-Item -ItemType Directory -Path $Destination | Out-Null
          }

          Write-Host "Copying Windows build into installer staging directory..."

          Copy-Item $Source $Destination -Recurse -Force

          Write-Host "Installer staging complete."

      # ---------------------------------------------------------
      # STEP 5 - BUILD INNO SETUP INSTALLER
      # ---------------------------------------------------------

      - name: Build Inno Setup installer
        shell: powershell
        run: |
          $Version = "${{ inputs.version }}"

          if ($Version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Version must use format X.Y.Z, for example 0.1.1"
          }

          $InnoCompiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          $InnoScript = "D:\DocOnPlaneInstaller\DocOnPlaneInstallerScript.iss"

          $InstallerExe = "D:\DocOnPlaneInstaller\Output\DocOnThePlane_v$Version.exe"

          if (-not (Test-Path $InnoCompiler)) {
              throw "Inno Setup compiler was not found: $InnoCompiler"
          }

          if (-not (Test-Path $InnoScript)) {
              throw "Inno Setup script was not found: $InnoScript"
          }

          # Delete this exact version first so an old installer
          # cannot make the verification step falsely succeed.
          if (Test-Path $InstallerExe) {
              Remove-Item $InstallerExe -Force
          }

          Write-Host "Building installer version $Version..."

          & $InnoCompiler "/DMyAppVersion=$Version" $InnoScript

          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path $InstallerExe)) {
              throw "Installer was not created at expected path: $InstallerExe"
          }

          Write-Host ""
          Write-Host "Installer created successfully:"
          Write-Host $InstallerExe

      # ---------------------------------------------------------
      # STEP 6 - DEPLOY TO ITCH.IO
      # ---------------------------------------------------------

      - name: Deploy to itch.io
        shell: powershell
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          $Version = "${{ inputs.version }}"
          $InstallerExe = "D:\DocOnPlaneInstaller\Output\DocOnThePlane_v$Version.exe"
          $ItchTarget = "coderedranger/doctorontheplane:windows"

          if (-not (Test-Path $InstallerExe)) {
              throw "Installer was not found: $InstallerExe"
          }

          Write-Host "Deploying version $Version to itch.io..."

          butler push "$InstallerExe" $ItchTarget --userversion $Version

          if ($LASTEXITCODE -ne 0) {
              throw "Butler deployment failed with exit code $LASTEXITCODE"
          }

          Write-Host "Deployment complete."
