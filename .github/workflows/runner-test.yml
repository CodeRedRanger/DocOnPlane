name: Unreal Runner Checkout Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Confirm repository checkout
        shell: powershell
        run: |
          Write-Host "Repository checked out to:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "Repository contents:"
          Get-ChildItem $env:GITHUB_WORKSPACE

      - name: Verify Git LFS assets
        shell: powershell
        run: |
          Write-Host "Git LFS files:"
          git lfs ls-files

          $Project = Join-Path $env:GITHUB_WORKSPACE "DocOnThePlane.uproject"

          if (-not (Test-Path $Project)) {
              throw "DocOnThePlane.uproject was not found."
          }

          Write-Host ""
          Write-Host "Unreal project found:"
          Write-Host $Project
